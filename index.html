    const shuffleDeck = (deck) => {
      const newDeck = [...deck];
      for (let i = newDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newDeck[i], newDeck[j]] = [newDeck[j], newDeck[i]];
      }
      return newDeck;
    };

    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'flip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'trap') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.45);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.45);
          osc.start();
          osc.stop(ctx.currentTime + 0.45);
        } else if (type === 'shuffle') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'coin') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(698.46, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'win') {
          const notes = [293.66, 349.23, 440.00, 587.33, 698.46];
          notes.forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            g.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.08);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.08 + 0.3);
            o.start(ctx.currentTime + idx * 0.08);
            o.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } else if (type === 'lose') {
          const notes = [440.00, 392.00, 329.63, 220.00];
          notes.forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.connect(g);
            g.connect(ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            g.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.12);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.3);
            o.start(ctx.currentTime + idx * 0.12);
            o.stop(ctx.currentTime + idx * 0.12 + 0.3);
          });
        }
      } catch (e) {
        console.warn("Audio Context block protection.", e);
      }
    };

        'border-red-500';

      const localImagePath = `public/assets/cards/${card.imageName}`;

      return (
        <div className={`flip-card w-11 h-16 md:w-12 md:h-18 ${isFlipped ? 'flipped' : ''} ${borderGlow}`}>
          <div className="flip-card-inner w-full h-full relative">
            
            {/* Back of Trap Card */}
            <div className="flip-card-back absolute inset-0 rounded-xl bg-slate-950 border-2 border-red-600/80 flex flex-col items-center justify-center backface-hidden shadow-inner">
              <span className="text-red-500 text-[8px] font-black tracking-tight leading-none uppercase">Trap</span>
              <div className="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse mt-1" />
            </div>

            {/* Front of Trap Card */}
            <div className={`flip-card-front absolute inset-0 rounded-xl bg-slate-900 border-2 ${cardBorderClass} flex flex-col items-center justify-center backface-hidden shadow-md rotate-y-180 overflow-hidden`}>
              {!imageError ? (
                <img 
                  src={localImagePath} 
                  onError={() => setImageError(true)} 
                  alt={card.name} 
                  className="w-full h-full object-cover"
                />
              ) : (
                <div className="w-full h-full flex flex-col items-center justify-between p-1">
                  <div className="w-3 h-3 rounded-full bg-amber-500 border border-slate-950 flex items-center justify-center self-start">
                    <span className="text-slate-950 text-[6px] font-black">{card.energy}</span>
                  </div>
                  <Icon className="w-5 h-5 drop-shadow" />
                  <span className="text-[6px] font-bold text-slate-300 text-center leading-none truncate w-full capitalize">
                    {card.name}
                  </span>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    };

    // Helper: silently probes whether a local PNG can load, returns a badge
    const LiveImageStatus = ({ imageName }) => {
      const [status, setStatus] = useState('loading'); // 'loading' | 'ok' | 'missing'
      useEffect(() => {
        const img = new window.Image();
        img.onload  = () => setStatus('ok');
        img.onerror = () => setStatus('missing');
        img.src = `public/assets/cards/${imageName}`;
      }, [imageName]);

      if (status === 'loading') return (
        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold bg-slate-800 text-slate-400 border border-slate-700">
          <span className="w-1.5 h-1.5 rounded-full bg-slate-500 animate-pulse inline-block"/>Verificando…
        </span>
      );
      if (status === 'ok') return (
        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-700">
          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"/>✓ OK
        </span>
      );
      return (
        <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9px] font-bold bg-red-950 text-red-400 border border-red-700">
          <span className="w-1.5 h-1.5 rounded-full bg-red-500 inline-block"/>✗ Falta
        </span>
      );
    };

    function App() {
      // SLP currency balance and quest state
      const [balance, setBalance] = useState(1000);
      const [dailyQuestClaimed, setDailyQuestClaimed] = useState(false);

      // Core gameplay states
      const [gamePhase, setGamePhase] = useState('betting'); // 'betting' | 'racing' | 'finished'
      const [bets, setBets] = useState({ plant: 0, reptile: 0, aquatic: 0, bird: 0, beast: 0, bug: 0 });
      const [positions, setPositions] = useState({ plant: 0, reptile: 0, aquatic: 0, bird: 0, beast: 0, bug: 0 });

      // Deck structures
      const [drawPile, setDrawPile] = useState([]);
      const [discardPile, setDiscardPile] = useState([]);
      const [lastDrawnCard, setLastDrawnCard] = useState(null);

      // Trap Card placements (9 vertical milestones)
      const [trapCards, setTrapCards] = useState([]);
      const [trapTriggered, setTrapTriggered] = useState(Array(9).fill(false));
      const [activeTrapEffect, setActiveTrapEffect] = useState(null);

      // Game completion state
      const [winner, setWinner] = useState(null);
      const [winStats, setWinStats] = useState({ plant: 0, reptile: 0, aquatic: 0, bird: 0, beast: 0, bug: 0 });

      // Autoplay options
      const [isAutoplay, setIsAutoplay] = useState(false);
      const [autoplaySpeed, setAutoplaySpeed] = useState(500); 
      const [isShufflingMessage, setIsShufflingMessage] = useState(false);

      // Modal / Help panel states
      const [isCodexOpen, setIsCodexOpen] = useState(false);
      const [codexTab, setCodexTab] = useState('gallery'); // 'gallery' | 'verifier'
      const [filterClass, setFilterClass] = useState('all');
      const [filterType, setFilterType] = useState('all');

      const setupRace = () => {
        const totalBet = Object.values(bets).reduce((a, b) => a + b, 0);
        if (totalBet === 0) {
          alert("¡Por favor, realiza al menos una apuesta de SLP antes de empezar!");
          return;
        }
        playSound('shuffle');

        // Create a shuffled mazo using exactly 132 Level 1 Cards
        const fullDeck = shuffleDeck(ALL_CARDS_DATABASE);

        // Dynamic split: 9 Cards as traps, remaining 123 Cards as drawing deck
        const traps = fullDeck.slice(0, 9);
        const racingDeck = fullDeck.slice(9);

        setTrapCards(traps);
        setTrapTriggered(Array(9).fill(false));
        setDrawPile(racingDeck);
        setDiscardPile([]);
        setLastDrawnCard(null);
        setActiveTrapEffect(null);
        setWinner(null);

        // Reset lane positions to 0
        setPositions({ plant: 0, reptile: 0, aquatic: 0, bird: 0, beast: 0, bug: 0 });
        setGamePhase('racing');
      };

      const recycleDiscards = () => {
        if (discardPile.length === 0) return;
        setIsShufflingMessage(true);
        playSound('shuffle');
        
        setTimeout(() => {
          const recycled = shuffleDeck([...discardPile]);
          setDrawPile(recycled);
          setDiscardPile([]);
          setIsShufflingMessage(false);
        }, 600);
      };

      const drawNextCard = () => {
        if (winner || activeTrapEffect || isShufflingMessage) return;

        if (drawPile.length === 0) {
          if (discardPile.length > 0) {
            recycleDiscards();
          } else {
            setDrawPile(shuffleDeck(ALL_CARDS_DATABASE));
          }
          return;
        }

        playSound('flip');

        const nextCard = drawPile[0];
        const updatedDrawPile = drawPile.slice(1);
        const updatedDiscardPile = [nextCard, ...discardPile];

        setLastDrawnCard(nextCard);
        setDrawPile(updatedDrawPile);
        setDiscardPile(updatedDiscardPile);

        const activeClass = nextCard.class;
        const currentPos = positions[activeClass];
        const nextPos = Math.min(currentPos + 1, 10);

        const updatedPositions = {
          ...positions,
          [activeClass]: nextPos
        };

        setPositions(updatedPositions);

        if (nextPos === 10) {
          declareWinner(activeClass);
          return;
        }

        // Traps Activation evaluation (milestones H-1 to H-9)
        for (let m = 1; m <= 9; m++) {
          const trapIdx = m - 1;

          if (!trapTriggered[trapIdx]) {
            // Are ALL active racer lanes currently at or past this step level?
            const allCleared = CLASSES.every(cls => updatedPositions[cls] >= m);

            if (allCleared) {
              const trapCard = trapCards[trapIdx];
              const trapClass = trapCard.class;

              const nextTrapsTriggered = [...trapTriggered];
              nextTrapsTriggered[trapIdx] = true;
              setTrapTriggered(nextTrapsTriggered);

              setActiveTrapEffect({
                class: trapClass,
                milestone: m,
                card: trapCard
              });

              playSound('trap');

              const tempAutoplay = isAutoplay;
              if (isAutoplay) setIsAutoplay(false);

              // Retroceder un casillero visual delay
              setTimeout(() => {
                setPositions(prev => {
                  const oldPos = prev[trapClass];
                  const penPos = Math.max(oldPos - 1, 0);
                  return {
                    ...prev,
                    [trapClass]: penPos
                  };
                });
              }, 500);

              setTimeout(() => {
                setActiveTrapEffect(null);
                if (tempAutoplay) setIsAutoplay(true);
              }, 1300);

              break;
            }
          }
        }
      };

      const declareWinner = (classWinner) => {
        setWinner(classWinner);
        setGamePhase('finished');
        setIsAutoplay(false);

        const winAmount = Math.floor(bets[classWinner] * CLASSE_META[classWinner].odd);

        if (winAmount > 0) {
          playSound('win');
          setBalance(prev => prev + winAmount);
        } else {
          playSound('lose');
        }

        setWinStats(prev => ({
          ...prev,
          [classWinner]: prev[classWinner] + 1
        }));
      };

      useEffect(() => {
        let intervalId = null;
        if (isAutoplay && gamePhase === 'racing' && !winner && !activeTrapEffect && !isShufflingMessage) {
          intervalId = setInterval(() => {
            drawNextCard();
          }, autoplaySpeed);
        }
        return () => {
          if (intervalId) clearInterval(intervalId);
        };
      }, [isAutoplay, gamePhase, drawPile, positions, winner, activeTrapEffect, isShufflingMessage, autoplaySpeed]);

      const handleQuickBet = (cls, amount) => {
        playSound('coin');
        if (amount === 'MAX') {
          setBets(prev => ({
            ...prev,
            [cls]: prev[cls] + balance
          }));
          setBalance(0);
        } else {
          if (balance >= amount) {
            setBets(prev => ({
              ...prev,
              [cls]: prev[cls] + amount
            }));
            setBalance(prev => prev - amount);
          } else {
            setBets(prev => ({
              ...prev,
              [cls]: prev[cls] + balance
            }));
            setBalance(0);
          }
        }
      };

      const clearBets = () => {
        playSound('coin');
        const refundedBets = Object.values(bets).reduce((a, b) => a + b, 0);
        setBalance(prev => prev + refundedBets);
        setBets({ plant: 0, reptile: 0, aquatic: 0, bird: 0, beast: 0, bug: 0 });
      };

      const claimDailyQuest = () => {
        playSound('coin');
        setBalance(prev => prev + 500);
        setDailyQuestClaimed(true);
        setTimeout(() => {
          setDailyQuestClaimed(false);
        }, 15000);
      };

      const filteredCodexCards = ALL_CARDS_DATABASE.filter(card => {
        const matchesClass = filterClass === 'all' || card.class === filterClass;
        const matchesType = filterType === 'all' || card.partType === filterType;
        return matchesClass && matchesType;
      });

      const totalBetAmount = Object.values(bets).reduce((a, b) => a + b, 0);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans p-2 sm:p-4 md:p-6 font-fredoka flex flex-col items-center">
          <style>{`
            .flip-card {
              perspective: 1000px;
            }
            .flip-card-inner {
              transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
              transform-style: preserve-3d;
            }
            .flipped .flip-card-inner {
              transform: rotateY(180deg);
            }
            .backface-hidden {
              backface-visibility: hidden;
              -webkit-backface-visibility: hidden;
            }
            .rotate-y-180 {
              transform: rotateY(180deg);
            }
            @keyframes pulse-gold {
              0%, 100% { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 0 4px 0px rgba(245, 158, 11, 0.2); }
              50% { border-color: rgba(245, 158, 11, 1); box-shadow: 0 0 16px 4px rgba(245, 158, 11, 0.5); }
            }
            .animate-pulse-gold {
              animation: pulse-gold 2s infinite;
            }
            @keyframes trap-flash {
              0%, 100% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 0px rgba(239, 68, 68, 0); }
              50% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 20px 8px rgba(239, 68, 68, 0.6); }
            }
            .animate-trap-flash {
              animation: trap-flash 1s infinite;
            }
            .animate-fade-in {
              animation: fadeIn 0.25s ease-out forwards;
            }
            @keyframes fadeIn {
              from { opacity: 0; transform: translateY(-10px); }
              to { opacity: 1; transform: translateY(0); }
            }
            @keyframes drawCardAnim {
              0% {
                transform: scale(0.4) translateX(-100px) rotate(-35deg);
                opacity: 0;
                filter: blur(4px) brightness(2.5) drop-shadow(0 0 20px currentColor);
              }
              50% {
                transform: scale(1.1) rotateY(90deg);
                filter: brightness(1.5) drop-shadow(0 0 25px currentColor);
              }
              100% {
                transform: scale(1) translateX(0) rotate(0deg);
                opacity: 1;
                filter: blur(0) brightness(1) drop-shadow(0 8px 12px rgba(0,0,0,0.4));
              }
            }
            .animate-draw-card {
              animation: drawCardAnim 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.2) forwards;
              transform-style: preserve-3d;
            }
          `}</style>

          {winner && bets[winner] > 0 && <ConfettiEffect />}

          {/* Header with SLP potion branding */}
          <header className="w-full max-w-6xl flex flex-col sm:flex-row justify-between items-center mb-6 bg-slate-900 border border-slate-800 rounded-2xl p-4 gap-4 shadow-xl shadow-black/30">
            <div className="flex items-center gap-3">
              <div className="bg-gradient-to-tr from-amber-500 to-yellow-300 p-2.5 rounded-xl shadow-lg shadow-amber-500/20">
                <Sparkles className="w-8 h-8 text-slate-950" strokeWidth={2.5} />
              </div>
              <div>
                <h1 className="text-2xl md:text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-yellow-200 to-emerald-400 tracking-wide uppercase">
                  Axie Card Derby
                </h1>
                <p className="text-xs text-slate-400">Mazo de 132 Cartas Oficiales de Axie Infinity Classic</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <button
                onClick={() => setIsCodexOpen(true)}
                className="px-4 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 rounded-xl text-xs font-black flex items-center gap-1.5 transition-all active:scale-95 text-white shadow-md shadow-indigo-950/40"
              >
                <BookOpen className="w-4 h-4" /> Codex de 132 Cartas
              </button>

              {/* SLP Balance widget */}
              <div className="flex items-center gap-4 bg-slate-950/60 border border-slate-800 rounded-2xl p-3 px-5 shadow-inner">
                <div className="flex items-center gap-2">
                  <span className="text-xl">🧪</span>
                  <div>
                    <div className="text-[10px] text-slate-400 uppercase tracking-widest leading-none">Mi Balance</div>
                    <div className="text-lg md:text-xl font-black text-emerald-400 flex items-center gap-1">
                      {balance.toLocaleString()} <span className="text-xs text-emerald-500">SLP</span>
                    </div>
                  </div>
                </div>
                
                <button
                  onClick={claimDailyQuest}
                  disabled={dailyQuestClaimed}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                    dailyQuestClaimed 
                      ? 'bg-slate-800 text-slate-500 cursor-not-allowed' 
                      : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 hover:scale-105 active:scale-95 shadow-md shadow-emerald-500/10'
                  }`}
                >
                  {dailyQuestClaimed ? 'Recargando...' : 'Misión diaria (+500)'}
                </button>
              </div>
            </div>
          </header>

          {/* Reshuffle Notification Banner */}
          {isShufflingMessage && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-50 bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-full shadow-lg text-xs tracking-wider uppercase animate-bounce flex items-center gap-2 border border-amber-300">
              🔄 Reciclando mazo de descartes de Classic...
            </div>
          )}

          {/* Active Trap Announcement Pop-up */}
          {activeTrapEffect && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex items-center justify-center p-2 pointer-events-none animate-fade-in w-80">
              <div className="bg-slate-900/95 border-2 border-red-500 rounded-2xl p-3 text-center shadow-2xl shadow-red-500/30 backdrop-blur-md pointer-events-auto flex items-center gap-3 w-full">
                <div className="flex-1 text-left">
                  <div className="text-red-500 text-sm font-black flex items-center gap-1">⚠️ TRAP TRIGGERED H-{activeTrapEffect.milestone}</div>
                  <p className="text-[10px] text-slate-300">
                    La carta trampa es de <strong className={CLASSE_META[activeTrapEffect.class].text}>{CLASSE_META[activeTrapEffect.class].name}</strong>. ¡Su Axie retrocede 1 casillero!
                  </p>
                </div>
                <div className="shrink-0 scale-90">
                  <TrapCardVertical card={activeTrapEffect.card} isFlipped={true} borderGlow="animate-trap-flash border border-red-500 rounded-xl animate-bounce" />
                </div>
              </div>
            </div>
          )}

          {/* MAIN LAYOUT */}
          <main className="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            {/* LEFT PANEL: VERTICAL TRACK BOARD */}
            <section className="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xl shadow-black/20 flex flex-col gap-6">
              
              {gamePhase === 'betting' ? (
                /* BETTING PANEL LOBBY */
                <div>
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-4 mb-4 gap-3">
                    <div>
                      <h2 className="text-xl font-bold text-slate-100">Lobby de Apuestas</h2>
                      <p className="text-xs text-slate-400">Selecciona tus Axies y apuesta SLP. Las cartas se cargan desde tu carpeta de activos local.</p>
                    </div>
                  </div>

                  {/* Class Bets Grid Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    {CLASSES.map(cls => {
                      const meta = CLASSE_META[cls];
                      const Icon = meta.icon;
                      const currentBet = bets[cls];
                      return (
                        <div key={cls} className={`rounded-2xl border-2 p-3.5 flex flex-col justify-between transition-all relative ${meta.bg} ${currentBet > 0 ? 'border-amber-400 ring-2 ring-amber-400/20 shadow-lg shadow-amber-400/5' : 'border-slate-800 hover:border-slate-700'}`}>
                          <div className="flex items-center gap-3">
                            <div className="p-1 rounded-xl bg-slate-900 shadow">
                              <Icon className="w-10 h-10" />
                            </div>
                            <div>
                              <div className="font-bold text-sm text-slate-100">{meta.name}</div>
                              <div className="text-[10px] text-slate-400 italic">{meta.slogan}</div>
                            </div>
                          </div>

                          <div className="flex justify-between items-baseline mt-4 mb-3">
                            <span className="text-xs text-slate-400">Multiplicador: <strong className="text-amber-400 font-bold text-sm">x{meta.odd.toFixed(1)}</strong></span>
                            <div className="text-right">
                              <div className="text-[9px] text-slate-500 uppercase leading-none">Puesto</div>
                              <div className={`font-black text-sm ${currentBet > 0 ? 'text-amber-400' : 'text-slate-400'}`}>{currentBet} SLP</div>
                            </div>
                          </div>

                          <div className="grid grid-cols-4 gap-1.5">
                            <button
                              onClick={() => handleQuickBet(cls, 10)}
                              className="bg-slate-950/60 hover:bg-slate-950 text-[10px] font-bold py-1 px-1 rounded-lg text-slate-300 border border-slate-800 transition-all"
                            >
                              +10
                            </button>
                            <button
                              onClick={() => handleQuickBet(cls, 50)}
                              className="bg-slate-950/60 hover:bg-slate-950 text-[10px] font-bold py-1 px-1 rounded-lg text-slate-300 border border-slate-800 transition-all"
                            >
                              +50
                            </button>
                            <button
                              onClick={() => handleQuickBet(cls, 100)}
                              className="bg-slate-950/60 hover:bg-slate-950 text-[10px] font-bold py-1 px-1 rounded-lg text-slate-300 border border-slate-800 transition-all"
                            >
                              +100
                            </button>
                            <button
                              onClick={() => handleQuickBet(cls, 'MAX')}
                              className="bg-amber-500/20 hover:bg-amber-500/30 text-[10px] font-bold py-1 px-1 rounded-lg text-amber-400 border border-amber-500/30 transition-all"
                            >
                              MAX
                            </button>
                          </div>

                          {winStats[cls] > 0 && (
                            <div className="absolute top-2 right-2 bg-slate-900 border border-slate-800 rounded-full px-2 py-0.5 text-[9px] text-amber-400 font-semibold">
                              🏆 {winStats[cls]} {winStats[cls] === 1 ? 'Vic.' : 'Vics.'}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Start Game Bar */}
                  <div className="mt-6 flex flex-col sm:flex-row justify-between items-center bg-slate-950/40 border border-slate-800 rounded-2xl p-4 gap-4">
                    <div className="text-center sm:text-left">
                      <span className="text-xs text-slate-400">Apuesta Total</span>
                      <div className="text-xl font-black text-amber-400">
                        {totalBetAmount} <span className="text-xs text-slate-500">SLP</span>
                      </div>
                    </div>
                    <div className="flex gap-3 w-full sm:w-auto">
                      <button
                        onClick={clearBets}
                        className="w-1/2 sm:w-auto px-4 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl transition-all text-xs"
                      >
                        Vaciar Apuestas
                      </button>
                      <button
                        onClick={setupRace}
                        className="w-1/2 sm:w-auto px-10 py-3.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 text-base font-black uppercase tracking-wider rounded-2xl shadow-lg shadow-amber-500/20 transform hover:-translate-y-0.5 active:translate-y-0 transition-all"
                      >
                        ¡Iniciar!
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                /* ACTIVE VERTICAL TRACK GAMEBOARD */
                <div>
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                        <span className="animate-pulse text-emerald-400">●</span> Partida Salieron los Competidores...
                      </h2>
                      <p className="text-xs text-slate-400">Meta: Nivel 10. Las cartas trampa están posicionadas verticalmente a la izquierda.</p>
                    </div>
                    {winner && (
                      <button
                        onClick={() => setGamePhase('betting')}
                        className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-black text-amber-400 rounded-xl transition-all border border-slate-700"
                      >
                        Volver a Apostar
                      </button>
                    )}
                  </div>

                  {/* VERTICAL BOARD CONTAINER */}
                  <div className="w-full overflow-x-auto">
                    <div className="min-w-[500px] bg-slate-950 border-2 border-slate-800 rounded-2xl p-4 flex flex-col">
                      
                      {/* Grid System: 11 rows and 8 columns (1 trap, 1 scale label, 6 lanes) */}
                      <div 
                        className="grid relative"
                        style={{
                          gridTemplateColumns: "minmax(60px, 70px) 3rem repeat(6, 1fr)",
                          gridTemplateRows: "repeat(11, minmax(44px, 52px))",
                          height: "550px"
                        }}
                      >
                        
                        {/* Step rows starting from 10 down to 0 */}

                                    <div className="font-bold text-slate-100 text-[11px]">{card.name}</div>
                                    <div className="text-slate-500 text-[9px] italic">{card.part}</div>
                                    <div className="text-slate-600 font-mono text-[8px] mt-0.5">{card.imageName}</div>
                                  </td>
                                  {/* Class badge */}
                                  <td className="px-3 py-2 whitespace-nowrap">
                                    <span className="font-bold text-[10px]" style={{ color: meta.color }}>{meta.name}</span>
                                  </td>
                                  {/* Part type */}
                                  <td className="px-3 py-2 whitespace-nowrap text-slate-400 text-[10px]">{partLabel}</td>
                                  {/* Energy */}
                                  <td className="px-3 py-2 text-center">
                                    <span className="inline-flex w-5 h-5 rounded-full bg-gradient-to-tr from-yellow-500 to-amber-300 items-center justify-center text-slate-950 font-black text-[9px]">
                                      {card.energy}
                                    </span>
                                  </td>
                                  {/* ATK */}
                                  <td className="px-3 py-2 text-center">
                                    {card.atk > 0
                                      ? <span className="font-black text-red-400 text-[11px]">{card.atk}</span>
                                      : <span className="text-slate-700">—</span>
                                    }
                                  </td>
                                  {/* DEF */}
                                  <td className="px-3 py-2 text-center">
                                    {card.def > 0
                                      ? <span className="font-black text-emerald-400 text-[11px]">{card.def}</span>
                                      : <span className="text-slate-700">—</span>
                                    }
                                  </td>
                                  {/* Effect */}
                                  <td className="px-3 py-2 max-w-xs">
                                    <p className="text-slate-300 text-[10px] leading-snug line-clamp-2">{card.effect}</p>
                                  </td>
                                  {/* Live PNG status */}
                                  <td className="px-3 py-2 text-center whitespace-nowrap">
                                    <LiveImageStatus imageName={card.imageName} />
                                  </td>
                                </tr>
                              );
                            })
                          }
                        </tbody>
                      </table>
                    </div>

                    {/* Verifier footer with summary */}
                    <div className="p-3 border-t border-slate-800 bg-slate-900/40 flex justify-between items-center text-xs text-slate-400">
                      <span>
                        Total: <strong className="text-white">{ALL_CARDS_DATABASE.filter(c => filterClass === 'all' || c.class === filterClass).length}</strong> cartas listadas
                      </span>
                      <span className="text-[10px]">
                        Los íconos <span className="text-emerald-400 font-bold">✓ OK</span> indican PNG cargado · <span className="text-red-400 font-bold">✗ Falta</span> indica archivo ausente
                      </span>
                    </div>
                  </>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
